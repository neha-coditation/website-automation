name: Neon migration smoke test

on:
  workflow_dispatch:

jobs:
  migrate-test-database:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.MARKETING_STUDIO_TEST_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/marketing-studio-phases-1-5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require test database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add MARKETING_STUDIO_TEST_DATABASE_URL in GitHub Actions secrets. Use the direct connection string for the prisma-deploy-check-20261030 Neon branch."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply committed migrations
        run: npm run db:deploy

      - name: Verify migration status
        run: npx prisma migrate status
